# Netlify's remote build detected Next.js but never ran its Next.js runtime: it
# uploaded the raw .next folder with no functions, so every route was
# Netlify's own 404. Declaring the plugin (and pinning it in devDependencies)
# makes the runtime run instead of relying on auto-detection.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # Next.js 16 needs Node 20.9 or newer.
  NODE_VERSION = "22"

[[plugins]]
  package = "@netlify/plugin-nextjs"
